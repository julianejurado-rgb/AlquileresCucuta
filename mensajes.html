<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Conversaciones con propietarios e interesados en EstudioCúcuta.">
  <title>Mensajes — EstudioCúcuta</title>
  <link rel="stylesheet" href="css/mensajes.css">
  <script src="js/datos.js" defer></script>
  <script src="js/proteger.js" defer></script>
  <script src="js/nav.js" defer></script>
  <script src="js/mensajes.js" defer></script>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">EstudioCúcuta</a>

      <nav class="main-nav" id="main-nav" aria-label="Navegación principal">
        <a href="index.html">Anuncios</a>
        <a href="acceder.html">Iniciar sesión</a>
        <a href="registro.html">Registrarse</a>
      </nav>
    </div>
  </header>

  <main class="pagina-mensajes">

    <div id="vista-lista">
      <h1>Mensajes</h1>

      <p id="sin-conversaciones" class="sin-anuncios" hidden>
        Todavía no tienes conversaciones. Contacta al propietario de un anuncio desde su página de detalle para empezar una.
      </p>

      <ul class="conversaciones" id="lista-conversaciones"></ul>
    </div>

    <div id="vista-hilo" class="hilo" hidden>
      <p class="volver"><a href="mensajes.html">&larr; Volver a mensajes</a></p>

      <h1 id="hilo-titulo"></h1>
      <p id="hilo-meta" class="hilo__meta"></p>

      <ul class="hilo__mensajes" id="hilo-mensajes"></ul>

      <form id="form-mensaje">
        <textarea id="texto-mensaje" rows="2" maxlength="1000" placeholder="Escribe un mensaje..." required></textarea>
        <button type="submit" class="boton boton--primario">Enviar</button>
      </form>
    </div>

  </main>

  <footer class="site-footer">
    <p>&copy; 2026 EstudioCúcuta — Proyecto académico.</p>
  </footer>

</body>
</html>
