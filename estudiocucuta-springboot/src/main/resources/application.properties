spring.application.name=estudiocucuta

# ===== Base de datos =====
# H2 en memoria: no hay que instalar nada, pero los datos se borran cada vez
# que se apaga la aplicación. Para pasar a MySQL, ver el README.
spring.datasource.url=jdbc:h2:mem:estudiocucuta
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Descomentar para ver en consola el SQL que genera JPA:
# spring.jpa.show-sql=true

# ===== Sesión =====
# SameSite=Lax impide que otros sitios hagan peticiones con la sesión del usuario.
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=2h

# ===== Errores =====
# Nunca mandar el detalle interno de Java (stack trace) en una respuesta de
# error. DevTools lo activa en desarrollo; aquí se apaga siempre.
server.error.include-stacktrace=never

# ===== Fotos de los anuncios =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=60MB
app.fotos.directorio=fotos-subidas

# ===== Datos iniciales =====
# La contraseña del admin se puede cambiar con la variable de entorno ADMIN_CONTRASENA.
app.admin.correo=admin@estudiocucuta.com
app.admin.contrasena=${ADMIN_CONTRASENA:admin123}
# Crea dos usuarios y dos anuncios de ejemplo al arrancar (útil para la presentación).
app.datos-demo=true
