spring.application.name=estudiocucuta

# ===== Base de datos =====
# MySQL en este mismo computador. La base y su usuario se crean una sola vez
# con base-de-datos/crear-base.sql; las tablas las crea Hibernate a partir de
# las entidades (ddl-auto=update: agrega tablas y columnas nuevas, nunca borra
# datos). Usuario y contraseña se pueden cambiar con las variables de entorno
# DB_USUARIO y DB_CONTRASENA. Para correr sin MySQL, ver application-h2.properties.
spring.datasource.url=jdbc:mysql://localhost:3306/estudiocucuta
spring.datasource.username=${DB_USUARIO:estudiocucuta}
spring.datasource.password=${DB_CONTRASENA:EstudioCucuta2026}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Descomentar para ver en consola el SQL que genera JPA:
# spring.jpa.show-sql=true

# ===== Sesión =====
# SameSite=Lax impide que otros sitios hagan peticiones con la sesión del usuario.
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=2h

# ===== Errores =====
# Nunca mandar el detalle interno de Java (stack trace) en una respuesta de
# error. DevTools lo activa en desarrollo; aquí se apaga siempre.
server.error.include-stacktrace=never

# ===== Fotos de los anuncios =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=60MB
app.fotos.directorio=fotos-subidas

# ===== Datos iniciales =====
# La contraseña del admin se puede cambiar con la variable de entorno ADMIN_CONTRASENA.
app.admin.correo=admin@estudiocucuta.com
app.admin.contrasena=${ADMIN_CONTRASENA:admin123}
# Crea dos usuarios y dos anuncios de ejemplo (útil para la presentación). Como
# DatosIniciales solo actúa con la base vacía, con MySQL pasa una sola vez.
app.datos-demo=true
