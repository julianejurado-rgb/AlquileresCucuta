# ===== Perfil "h2" =====
# La base en memoria de antes, para correr el proyecto en un computador sin
# MySQL (y para la prueba automática). Los datos se borran al apagar.
#   .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=h2"
# Todo lo demás se toma de application.properties.
spring.datasource.url=jdbc:h2:mem:estudiocucuta
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
